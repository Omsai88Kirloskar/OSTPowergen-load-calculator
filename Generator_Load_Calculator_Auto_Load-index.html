<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Load Calculator - Auto Load</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222}
.app{max-width:900px;margin:auto;background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001}
h1{font-size:23px;margin:0 0 6px}.sub,.note{font-size:12px;color:#666;line-height:1.5}
.row{display:grid;grid-template-columns:1.2fr 1fr .65fr .8fr 45px;gap:8px;margin:12px 0;align-items:end}
label{font-size:12px;color:#666;display:block;margin-bottom:4px}
select,input,button{width:100%;min-height:42px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;padding:8px;font-size:15px}
input[readonly]{background:#f1f3f5}
button{cursor:pointer;background:#eee}.primary{background:#1769aa;color:#fff;border:0}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{width:auto;padding:0 16px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.card{background:#f7f8fa;border:1px solid #ddd;border-radius:10px;padding:14px}
.card span{font-size:12px;color:#666}.card strong{display:block;font-size:22px;margin-top:5px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
@media(max-width:680px){.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}.summary,.controls{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
<!-- GENERATOR_REPORT_BRANDING -->
<style>
.report-header{display:flex;align-items:center;gap:18px;padding:16px;border:1px solid #ddd;border-radius:12px;background:#fafafa;margin-bottom:18px}
.report-header img{width:150px;height:82px;object-fit:contain;border-radius:6px}
.report-brand{flex:1}.report-brand h2{margin:0 0 5px;font-size:21px}.report-brand p{margin:2px 0;color:#555;font-size:13px}
.report-title{text-align:center;font-size:20px;font-weight:700;margin:12px 0}
</style>
<h1>Generator Load Calculator</h1>
<div class="sub">Select the load and rating. Unit kW is filled automatically. Change the quantity and the calculation updates automatically.</div>
<div id="rows"></div>

<div class="actions">
<button class="primary" onclick="addRow()">+ Add Load</button>
<button onclick="calculate()">Calculate</button>
<button onclick="resetAll()">Reset</button>
</div>

<div class="controls">
<div><label>Power Factor</label><input id="pf" type="number" min=".5" max="1" step=".01" value=".80" oninput="calculate()"></div>
<div><label>Safety Margin %</label><input id="margin" type="number" min="0" max="50" step="1" value="20" oninput="calculate()"></div>
</div>

<div class="summary">
<div class="card"><span>Total Load</span><strong id="kw">0.00 kW</strong></div>
<div class="card"><span>Required kVA</span><strong id="kva">0.00 kVA</strong></div>
<div class="card"><span>Recommended DG</span><strong id="dg">—</strong></div>
</div>
<p id="note" class="note"></p>
<div class="actions" style="margin-top:12px">
<button class="primary" onclick="downloadReport()">⬇ Download Report</button>
<button onclick="printReport()">🖨 Print / Save PDF</button>
</div>
</div>

<script>
const data={
"Split AC":{"1 Ton":1.1,"1.5 Ton":1.6,"2 Ton":2.1,"2.5 Ton":2.7,"3 Ton":3.2},
"Cassette AC":{"2 Ton":2.2,"3 Ton":3.3,"4 Ton":4.4,"5 Ton":5.5},
"Duct AC":{"5 Ton":5.8,"10 Ton":11.5,"15 Ton":16.5,"17 Ton":20,"20 Ton":23.5,"25 Ton":29},
"Lighting":{"1 kW":1,"5 kW":5,"10 kW":10,"20 kW":20,"30 kW":30,"40 kW":40,"50 kW":50},
"Motor/Pump":{"1 HP":0.75,"2 HP":1.5,"3 HP":2.2,"5 HP":3.7,"7.5 HP":5.5,"10 HP":7.5,"15 HP":11,"20 HP":15,"25 HP":18.5,"30 HP":22},
"Computer/IT":{"1 kW":1,"5 kW":5,"10 kW":10,"20 kW":20},
"Other":{"1 kW":1,"2 kW":2,"5 kW":5,"10 kW":10,"20 kW":20}
};
const sizes=[5,7.5,10,15,20,25,30,35,40,45,58.5,82.5,100,125,160,200,250,320,400,500,625,750,1010];

function addRow(type="Split AC",rating="1.5 Ton",qty=1){
 const box=document.createElement("div"); box.className="row";
 const typeOpts=Object.keys(data).map(t=>`<option ${t===type?"selected":""}>${t}</option>`).join("");
 box.innerHTML=`
 <div class="wide"><label>Load Type</label><select class="type" onchange="updateRating(this)">${typeOpts}</select></div>
 <div><label>Rating</label><select class="rating"></select></div>
 <div><label>Qty</label><input class="qty" type="number" min="0" step="1" value="${qty}" oninput="calculate()"></div>
 <div><label>Unit kW</label><input class="unit" type="number" readonly></div>
 <button onclick="this.parentElement.remove();calculate()">×</button>`;
 document.getElementById("rows").appendChild(box);
 const t=box.querySelector(".type"); updateRating(t,rating);
}
function updateRating(typeSelect, wanted){
 const box=typeSelect.parentElement.parentElement;
 const rating=box.querySelector(".rating"), unit=box.querySelector(".unit");
 const type=typeSelect.value, options=Object.keys(data[type]);
 rating.innerHTML=options.map(r=>`<option ${r===wanted?"selected":""}>${r}</option>`).join("");
 function set(){unit.value=data[type][rating.value];calculate()}
 rating.onchange=set; unit.value=data[type][rating.value]; calculate();
}
function calculate(){
 let total=0;
 document.querySelectorAll(".row").forEach(r=>{
  total+=(parseFloat(r.querySelector(".qty").value)||0)*(parseFloat(r.querySelector(".unit").value)||0);
 });
 const pf=Math.min(1,Math.max(.5,parseFloat(document.getElementById("pf").value)||.8));
 const margin=Math.min(50,Math.max(0,parseFloat(document.getElementById("margin").value)||0));
 const kva=total/pf, target=kva*(1+margin/100), dg=sizes.find(x=>x>=target);
 document.getElementById("kw").textContent=total.toFixed(2)+" kW";
 document.getElementById("kva").textContent=kva.toFixed(2)+" kVA";
 document.getElementById("dg").textContent=dg?dg+" kVA":"> 1010 kVA";
 document.getElementById("note").textContent=`Estimated basis: kW ÷ PF + ${margin}% safety margin. AC/motor values are typical planning estimates; final DG sizing should use actual nameplate/running current, starting current and load diversity.`;
}
function resetAll(){
 document.getElementById("rows").innerHTML="";
 addRow("Duct AC","17 Ton",1);
 addRow("Cassette AC","4 Ton",4);
 addRow("Split AC","1.5 Ton",11);
 addRow("Lighting","30 kW",1);
 calculate();
}
function getReportData(){
 const rows=[...document.querySelectorAll(".row")].map((r,i)=>({
  no:i+1,type:r.querySelector(".type").value,rating:r.querySelector(".rating").value,
  qty:r.querySelector(".qty").value,unit:r.querySelector(".unit").value,
  total:((parseFloat(r.querySelector(".qty").value)||0)*(parseFloat(r.querySelector(".unit").value)||0)).toFixed(2)
 }));
 calculate();
 return {rows,kw:document.getElementById("kw").textContent,kva:document.getElementById("kva").textContent,
 dg:document.getElementById("dg").textContent,pf:document.getElementById("pf").value,
 margin:document.getElementById("margin").value};
}
